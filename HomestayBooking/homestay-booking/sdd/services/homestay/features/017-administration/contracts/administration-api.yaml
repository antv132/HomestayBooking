openapi: 3.0.3
info:
  title: FR-17 Administration API
  version: 1.0.0
  description: |
    Homestay / Resort Booking — FR-17 Complaints, System Settings, Activity Logs.
    Screens: SCR-54 (Admin Complaints), SCR-56 (System Administration tabs).
    Content Moderation reviews: see FR-14 `review-api.yaml`.
    Customer Directory: see FR-09.
    Envelope: { success, message, data }

servers:
  - url: /api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: { type: object }

    ComplaintStatus:
      type: string
      enum: [OPEN, INVESTIGATING, RESOLVED, CLOSED]

    CreateComplaintRequest:
      type: object
      required: [subject, description]
      properties:
        subject:
          type: string
          minLength: 5
          maxLength: 200
        description:
          type: string
          minLength: 20
          maxLength: 2000

    UpdateComplaintStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ComplaintStatus'
        resolutionNotes:
          type: string
          minLength: 10
          maxLength: 2000
          description: Required when status is RESOLVED

    ComplaintCustomer:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }

    ComplaintSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        status: { $ref: '#/components/schemas/ComplaintStatus' }
        customerName: { type: string, description: Admin list only }
        createdAt: { type: string, format: date-time }

    ComplaintDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ComplaintStatus' }
        resolutionNotes: { type: string, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        customer:
          $ref: '#/components/schemas/ComplaintCustomer'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PageComplaintSummary:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ComplaintSummary' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    SystemSettings:
      type: object
      properties:
        depositPercentage: { type: integer, minimum: 10, maximum: 50, example: 40 }
        systemName: { type: string, example: Homestay Booking }
        supportEmail: { type: string, format: email }
        bankAccountNumber: { type: string }
        bankAccountName: { type: string }
        bankName: { type: string }
        cancelTimeoutHours: { type: integer, minimum: 1, maximum: 168, example: 24 }
        updatedAt: { type: string, format: date-time }

    UpdateSystemSettingsRequest:
      type: object
      properties:
        depositPercentage: { type: integer, minimum: 10, maximum: 50 }
        systemName: { type: string, minLength: 2, maxLength: 100 }
        supportEmail: { type: string, format: email }
        bankAccountNumber: { type: string, maxLength: 32 }
        bankAccountName: { type: string, maxLength: 200 }
        bankName: { type: string, maxLength: 200 }
        cancelTimeoutHours: { type: integer, minimum: 1, maximum: 168 }

    ActivityLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid, nullable: true }
        userEmail: { type: string, nullable: true }
        userFullName: { type: string, nullable: true }
        action: { type: string }
        entityType: { type: string, nullable: true }
        entityId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        createdAt: { type: string, format: date-time }

    PageActivityLog:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ActivityLogEntry' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

paths:
  /complaints:
    get:
      summary: Customer — list own complaints
      tags: [Customer Complaints]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated own complaints
    post:
      summary: Customer — create complaint
      tags: [Customer Complaints]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateComplaintRequest' }
      responses:
        '201':
          description: Complaint created with status OPEN

  /complaints/{id}:
    get:
      summary: Customer — complaint detail (own only)
      tags: [Customer Complaints]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Complaint detail
        '403':
          description: Not owner
        '404':
          description: Not found

  /admin/complaints:
    get:
      summary: SCR-54 — Admin complaint list
      tags: [Admin Complaints]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ComplaintStatus' }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated all complaints
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiSuccess' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PageComplaintSummary' }

  /admin/complaints/{id}:
    get:
      summary: SCR-54 — Admin complaint detail
      tags: [Admin Complaints]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detail with customer info

  /admin/complaints/{id}/status:
    patch:
      summary: SCR-54 — Update complaint status (workflow)
      tags: [Admin Complaints]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateComplaintStatusRequest' }
      responses:
        '200':
          description: Status updated
        '400':
          description: Invalid transition or missing resolutionNotes

  /admin/complaints/{id}/resolve:
    patch:
      summary: Legacy alias — resolve complaint (api-spec SCR-54)
      tags: [Admin Complaints]
      security: [{ bearerAuth: [] }]
      deprecated: true
      description: Prefer PATCH /admin/complaints/{id}/status with status RESOLVED
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution:
                  type: string
                  description: Maps to resolutionNotes
      responses:
        '200':
          description: Resolved

  /admin/settings:
    get:
      summary: SCR-56 System Settings tab — get all settings
      tags: [Admin Settings]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current system settings
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiSuccess' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SystemSettings' }
    put:
      summary: SCR-56 System Settings tab — update settings
      tags: [Admin Settings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSystemSettingsRequest' }
      responses:
        '200':
          description: Settings saved

  /admin/activity-logs:
    get:
      summary: SCR-56 Activity Logs tab — paginated audit log
      tags: [Admin Activity Logs]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: action
          in: query
          schema: { type: string }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated activity logs (read-only)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiSuccess' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PageActivityLog' }
