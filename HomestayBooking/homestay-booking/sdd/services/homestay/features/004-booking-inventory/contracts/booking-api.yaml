openapi: 3.0.3
info:
  title: FR-04 Booking & Inventory Management API
  version: 1.0.0
  description: |
    Homestay Booking — FR-04 booking endpoints (edu 2026-07-23).
    Screens: SCR-16–19 (Customer), SCR-34–35/37 check-in (Manager).
    Online payment: VNPay Return URL only (TD-011/012b). Cash remaining at desk in-scope.
    Inventory: half-open [checkIn, checkOut); RoomStatusBlock blocks create/modify.
    Envelope: { success, message, data } | { success, message, errors[] }
    Extensions: cancellation preview, manager cancel, modify booking.

servers:
  - url: /api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Success }
        data: { type: object }

    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    BookingStatus:
      type: string
      enum:
        - PENDING_DEPOSIT
        - CONFIRMED
        - CHECKED_IN
        - PENDING_INSPECTION
        - PENDING_DAMAGE_PAYMENT
        - CHECKED_OUT
        - CANCELLED
        - NO_SHOW

    PaymentMethod:
      type: string
      enum: [VNPAY]
      description: Edu online = VNPay only (TD-011). Cash remaining at check-in is not CreateBooking paymentMethod.

    CreateBookingRequest:
      type: object
      required: [roomId, checkIn, checkOut, guestCount, paymentMethod]
      properties:
        roomId: { type: string, format: uuid }
        checkIn: { type: string, format: date, example: "2026-07-01" }
        checkOut: { type: string, format: date, example: "2026-07-03" }
        guestCount: { type: integer, minimum: 1 }
        specialRequests: { type: string, maxLength: 2000 }
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'

    CreateBookingResponse:
      type: object
      properties:
        bookingId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BookingStatus' }
        totalAmount: { type: number, format: double }
        depositAmount: { type: number, format: double }
        remainingAmount: { type: number, format: double }
        holdExpiresAt: { type: string, format: date-time }
        paymentUrl:
          type: string
          description: VNPay redirect URL when paymentMethod=VNPAY

    BookingSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        roomName: { type: string }
        roomNumber: { type: string }
        propertyName: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        guestCount: { type: integer }
        totalAmount: { type: number }
        status: { $ref: '#/components/schemas/BookingStatus' }
        createdAt: { type: string, format: date-time }

    BookingDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        roomName: { type: string }
        roomNumber: { type: string }
        propertyName: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        guestCount: { type: integer }
        specialRequests: { type: string }
        totalAmount: { type: number }
        depositAmount: { type: number }
        remainingAmount: { type: number }
        damageFeeAmount: { type: number }
        paidAmount: { type: number }
        status: { $ref: '#/components/schemas/BookingStatus' }
        holdExpiresAt: { type: string, format: date-time, nullable: true }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        createdAt: { type: string, format: date-time }
        actions:
          type: array
          items:
            type: string
            enum: [PAY_DEPOSIT, UPLOAD_RECEIPT, PAY_REMAINING, CANCEL, WRITE_REVIEW]

    ManagerBookingDetail:
      allOf:
        - $ref: '#/components/schemas/BookingDetail'
        - type: object
          properties:
            customerId: { type: string, format: uuid }
            customerName: { type: string }
            customerEmail: { type: string, format: email }
            customerPhone: { type: string }

    PagedBookings:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BookingSummary'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    CancelBookingRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 1000 }

    ManagerCancelBookingRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 1000 }

    CancellationPreview:
      type: object
      properties:
        daysUntilCheckIn: { type: integer }
        refundPercent: { type: integer, example: 50 }
        refundAmount: { type: number }
        forfeitAmount: { type: number }
        policyText: { type: string }

    ModifyBookingRequest:
      type: object
      properties:
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        roomId: { type: string, format: uuid }

    ModifyBookingResponse:
      type: object
      properties:
        booking: { $ref: '#/components/schemas/ManagerBookingDetail' }
        priceDelta: { type: number, description: Positive = customer owes more }
        message: { type: string }

    UploadReceiptRequest:
      type: object
      required: [attachments]
      properties:
        attachments:
          type: array
          minItems: 1
          items:
            type: object
            required: [url, type]
            properties:
              url: { type: string, format: uri }
              type: { type: string, enum: [IMAGE, PDF] }

paths:
  /bookings:
    post:
      tags: [Customer Booking]
      summary: SCR-16 — Create booking and initiate deposit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created (Pending Deposit)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateBookingResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Room not available / inventory conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /bookings/me:
    get:
      tags: [Customer Booking]
      summary: SCR-17 — List my bookings
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
        - name: status
          in: query
          description: Comma-separated BookingStatus values
          schema: { type: string, example: "PENDING_DEPOSIT,CONFIRMED" }
        - name: sort
          in: query
          schema: { type: string, default: "createdAt,desc" }
      responses:
        '200':
          description: Paginated bookings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PagedBookings'

  /bookings/me/{id}:
    get:
      tags: [Customer Booking]
      summary: SCR-18 — Booking detail (self)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Booking detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BookingDetail'
        '403':
          description: Not owner
        '404':
          description: Not found

  /bookings/{id}/cancel/preview:
    get:
      tags: [Customer Booking]
      summary: SCR-19 — Cancellation refund preview
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Refund preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CancellationPreview'

  /bookings/{id}/cancel:
    patch:
      tags: [Customer Booking]
      summary: SCR-19 — Cancel booking (customer)
      description: Applies tiered refund policy on deposit paid.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingRequest'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '409':
          description: Cannot cancel (e.g. already checked in)

  /bookings/{id}/receipts:
    post:
      tags: [Customer Booking]
      summary: SCR-20 — Upload bank transfer receipt
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadReceiptRequest'
      responses:
        '200':
          description: Receipt submitted for verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /manager/bookings:
    get:
      tags: [Manager Booking]
      summary: SCR-34 — List bookings for assigned properties
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          description: Guest name or booking id
          schema: { type: string }
      responses:
        '200':
          description: Paginated manager bookings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PagedBookings'

  /manager/bookings/{id}:
    get:
      tags: [Manager Booking]
      summary: SCR-35 — Manager booking detail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ManagerBookingDetail'

    patch:
      tags: [Manager Booking]
      summary: Modify Confirmed booking (dates/room)
      description: FR-015 extension — only CONFIRMED status.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyBookingRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ModifyBookingResponse'
        '409':
          description: Room unavailable or invalid status

  /manager/bookings/{id}/check-in:
    patch:
      tags: [Manager Booking]
      summary: SCR-35 — Check in guest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '409':
          description: Remaining balance unpaid (if required) or invalid status

  /manager/bookings/{id}/check-out:
    patch:
      tags: [Manager Booking]
      summary: SCR-35 — Check out guest
      description: Requires Room Inspection PASSED; creates HousekeepingTask.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '409':
          description: Inspection not complete or unpaid damage fee

  /manager/bookings/{id}/cancel:
    patch:
      tags: [Manager Booking]
      summary: Manager-initiated cancel (100% deposit refund)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerCancelBookingRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /payments/vnpay/create-url:
    post:
      tags: [Payment]
      summary: Create VNPay payment URL for deposit or remaining balance
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [DEPOSIT, REMAINING_BALANCE]
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          paymentUrl: { type: string }

  /manager/payments/{id}/verify:
    patch:
      tags: [Manager Payment]
      summary: SCR-37 — Verify bank transfer (confirms booking on deposit approve)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                note: { type: string }
      responses:
        '200':
          description: On APPROVED for deposit → booking CONFIRMED + Outbox contract event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
