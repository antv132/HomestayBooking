<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth Service · Google Auth Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Google OAuth Login</h1>

    <svg viewBox="0 0 1024 760" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Lifelines -->
        <line x1="128" y1="128" x2="128" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="320" y1="128" x2="320" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="512" y1="128" x2="512" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="704" y1="128" x2="704" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="896" y1="128" x2="896" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation Bars -->
        <!-- AuthController -->
        <rect x="316" y="160" width="8" height="440" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- Google -->
        <rect x="508" y="200" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- AuthService -->
        <rect x="700" y="280" width="8" height="280" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Messages -->
        <!-- M1: User -> Controller -->
        <line x1="128" y1="160" x2="316" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="172" y="144" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="222" y="154" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /GOOGLE</text>

        <!-- M2: Controller -> Google -->
        <line x1="324" y1="200" x2="508" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="366" y="184" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="416" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">verifyToken()</text>

        <!-- M3: Google -> Controller -->
        <line x1="508" y1="240" x2="324" y2="240" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="366" y="224" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="416" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">User Profile</text>

        <!-- M4: Controller -> Service -->
        <line x1="324" y1="280" x2="700" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="466" y="264" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="512" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">loginWithGoogle()</text>

        <!-- M5: Service -> DB (Check Email) -->
        <line x1="708" y1="320" x2="896" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="752" y="304" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="802" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">findByEmail()</text>

        <!-- M6: DB -> Service (Not Found) -->
        <line x1="896" y1="360" x2="708" y2="360" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="752" y="344" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="802" y="354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">null (Not found)</text>

        <!-- M7: Service -> DB (Save User) -->
        <line x1="708" y1="400" x2="896" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="752" y="384" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="802" y="394" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">save(LINKED User)</text>

        <!-- M8: Service -> Service (Generate Tokens) -->
        <path d="M 708 440 L 744 440 L 744 472 L 708 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="752" y="450" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="802" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GENERATE TOKENS</text>

        <!-- M9: Service -> DB (Save Token) -->
        <line x1="708" y1="520" x2="896" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="752" y="504" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="802" y="514" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">save(RefreshToken)</text>

        <!-- M10: Service -> Controller (Return) -->
        <line x1="700" y1="560" x2="324" y2="560" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="466" y="544" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="512" y="554" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LoginResponse</text>

        <!-- M11: Controller -> User (200 OK) -->
        <line x1="316" y1="600" x2="128" y2="600" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="172" y="584" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="222" y="594" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · TOKENS</text>


        <!-- Actors -->
        <!-- Actor 1: User -->
        <rect x="56" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="64" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="78" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="128" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>
        <text x="128" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Client App</text>

        <!-- Actor 2: AuthController -->
        <rect x="248" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="248" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="256" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="272" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="320" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AuthController</text>
        <text x="320" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">REST Endpoint</text>

        <!-- Actor 3: Google -->
        <rect x="440" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="448" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="464" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="512" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Google</text>
        <text x="512" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OAuth Provider</text>

        <!-- Actor 4: AuthService (Coral) -->
        <rect x="632" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="632" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="640" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="656" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="704" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AuthService</text>
        <text x="704" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Business Logic</text>


        <!-- Actor 5: Database -->
        <rect x="824" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="824" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="832" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="848" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="896" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Database</text>
        <text x="896" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQL Server</text>

        <!-- Legend -->
        <line x1="56" y1="680" x2="968" y2="680" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="56" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="56" y="712" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="76" y="720" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal component</text>

        <rect x="200" y="708" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="212" y="720" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>

        <line x1="308" y1="718" x2="336" y2="718" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="344" y="720" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP request</text>

        <line x1="440" y1="718" x2="468" y2="718" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="476" y="720" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return / internal</text>

        <line x1="580" y1="718" x2="608" y2="718" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="616" y="720" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary response</text>

      </svg>
  </div>
</body>
</html>
