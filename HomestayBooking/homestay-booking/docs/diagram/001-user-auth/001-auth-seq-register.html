<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth Service · Registration & OTP Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Registration & OTP Verification</h1>

    <svg viewBox="0 0 1024 880" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Lifelines -->
        <line x1="128" y1="128" x2="128" y2="768" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="320" y1="128" x2="320" y2="768" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="512" y1="128" x2="512" y2="768" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="704" y1="128" x2="704" y2="768" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="896" y1="128" x2="896" y2="768" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation Bars -->
        <!-- AuthController Registration -->
        <rect x="316" y="160" width="8" height="340" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- AuthService Registration -->
        <rect x="508" y="200" width="8" height="260" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        
        <!-- AuthController OTP -->
        <rect x="316" y="540" width="8" height="220" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- AuthService OTP -->
        <rect x="508" y="580" width="8" height="140" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Messages -->
        <!-- M1: Guest -> Controller (Register) -->
        <line x1="128" y1="160" x2="316" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="172" y="144" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="222" y="154" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /REGISTER</text>

        <!-- M2: Controller -> Service (Register) -->
        <line x1="324" y1="200" x2="508" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="366" y="184" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="416" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">registerUser()</text>

        <!-- M3: Service -> DB (Check Email) -->
        <line x1="516" y1="240" x2="896" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="656" y="224" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="706" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">findByEmail()</text>

        <!-- M4: DB -> Service (Available) -->
        <line x1="896" y1="280" x2="516" y2="280" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="656" y="264" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="706" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">null (Available)</text>

        <!-- M5: Service -> DB (Save Inactive) -->
        <line x1="516" y1="320" x2="896" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="656" y="304" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="706" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">save(INACTIVE)</text>

        <!-- M6: Service -> Email (Send OTP) -->
        <line x1="516" y1="360" x2="704" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="560" y="344" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="610" y="354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">sendOtpEmail()</text>

        <!-- M7: Email -> Service (Sent) -->
        <line x1="704" y1="400" x2="516" y2="400" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="560" y="384" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="610" y="394" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">void</text>

        <!-- M8: Service -> Controller (Return) -->
        <line x1="508" y1="460" x2="324" y2="460" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="366" y="444" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="416" y="454" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DTO (pending)</text>

        <!-- M9: Controller -> Guest (201 Created) -->
        <line x1="316" y1="500" x2="128" y2="500" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="172" y="484" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="222" y="494" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">201 · VERIFY_OTP</text>

        <!-- M10: Guest -> Controller (Verify OTP) -->
        <line x1="128" y1="540" x2="316" y2="540" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="172" y="524" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="222" y="534" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /VERIFY-OTP</text>

        <!-- M11: Controller -> Service (verify) -->
        <line x1="324" y1="580" x2="508" y2="580" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="366" y="564" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="416" y="574" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">verifyOtp()</text>

        <!-- M12: Service -> DB (Check & Activate) -->
        <line x1="516" y1="620" x2="896" y2="620" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="656" y="604" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="706" y="614" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">update(ACTIVE)</text>

        <!-- M13: DB -> Service (OK) -->
        <line x1="896" y1="660" x2="516" y2="660" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="656" y="644" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="706" y="654" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">updated=1</text>

        <!-- M14: Service -> Controller (Tokens) -->
        <line x1="508" y1="720" x2="324" y2="720" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="366" y="704" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="416" y="714" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LoginResponse</text>

        <!-- M15: Controller -> Guest (200 OK + Tokens) -->
        <line x1="316" y1="760" x2="128" y2="760" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="172" y="744" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="222" y="754" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · TOKENS</text>


        <!-- Actors (drawn last so they sit above lines) -->
        <!-- Actor 1: Guest -->
        <rect x="56" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="64" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="78" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="128" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Guest</text>
        <text x="128" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Client App</text>

        <!-- Actor 2: AuthController -->
        <rect x="248" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="248" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="256" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="272" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="320" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AuthController</text>
        <text x="320" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">REST Endpoint</text>

        <!-- Actor 3: AuthService (Coral) -->
        <rect x="440" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="448" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="464" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="512" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AuthService</text>
        <text x="512" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Business Logic</text>

        <!-- Actor 4: EmailService -->
        <rect x="632" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="632" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="640" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="656" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="704" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EmailService</text>
        <text x="704" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SMTP Gateway</text>

        <!-- Actor 5: Database -->
        <rect x="824" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="824" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="832" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="848" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="896" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Database</text>
        <text x="896" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQL Server</text>

        <!-- Legend -->
        <line x1="56" y1="800" x2="968" y2="800" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="56" y="816" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <!-- Item 1: Actor swatch (coral focal) -->
        <rect x="56" y="832" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="76" y="840" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal component</text>

        <!-- Item 2: Activation bar swatch -->
        <rect x="200" y="828" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="212" y="840" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>

        <!-- Item 3: Request arrow (link-blue) -->
        <line x1="308" y1="838" x2="336" y2="838" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="344" y="840" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP request</text>

        <!-- Item 4: Return / async (muted dashed) -->
        <line x1="440" y1="838" x2="468" y2="838" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="476" y="840" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return / internal</text>

        <!-- Item 5: Primary response (coral) -->
        <line x1="580" y1="838" x2="608" y2="838" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="616" y="840" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary response</text>

      </svg>
  </div>
</body>
</html>
