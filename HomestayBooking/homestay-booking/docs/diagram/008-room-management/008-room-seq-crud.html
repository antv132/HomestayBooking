<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Management · Soft-Delete &amp; Validation Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.4rem, 2.2vw + 0.6rem, 1.9rem); font-weight: 400; letter-spacing: -0.02em; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence Diagram · 008 Room Management · CRUD</p>
    <h1>Room Soft-Delete &amp; Floor Validation</h1>

    <svg viewBox="0 0 1140 820" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.08)"/>
        </pattern>
        <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2d3142"/>
        </marker>
        <marker id="arr-ret" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arr-err" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#d32f2f"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

      <!-- ═══ PARTICIPANT HEADERS ═══ -->
      <!-- Manager: x=80, RoomController: x=280, RoomService: x=530, Database: x=800 -->

      <!-- Manager -->
      <rect x="32" y="24" width="96" height="36" rx="20" fill="#2d3142"/>
      <text x="80" y="47" fill="#ffffff" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Manager</text>

      <!-- RoomController -->
      <rect x="208" y="24" width="144" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="210" y="38" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">«CONTROLLER»</text>
      <text x="280" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RoomController</text>

      <!-- RoomService -->
      <rect x="450" y="24" width="144" height="36" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="452" y="38" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">«SERVICE»</text>
      <text x="522" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RoomService</text>

      <!-- Database -->
      <rect x="720" y="24" width="120" height="36" rx="4" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="722" y="38" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">«DATABASE»</text>
      <text x="780" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Database</text>

      <!-- Lifelines -->
      <line x1="80" y1="60" x2="80" y2="810" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="280" y1="60" x2="280" y2="810" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="522" y1="60" x2="522" y2="810" stroke="rgba(235,108,54,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="780" y1="60" x2="780" y2="810" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- ═══ FLOW 1: SOFT DELETE ═══ -->
      <rect x="20" y="88" width="1100" height="16" rx="3" fill="rgba(45,49,66,0.07)"/>
      <text x="36" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.14em">FLOW 1 — ROOM SOFT-DELETE</text>

      <!-- 1. Manager → RoomController: DELETE -->
      <line x1="80" y1="130" x2="272" y2="130" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="170" y="124" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">DELETE /rooms/{roomId}</text>

      <!-- 2. Ctrl self: @PropertyAccessValidator -->
      <path d="M280,148 Q320,148 320,160 Q320,172 280,172" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="328" y="163" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">@PropertyAccessValidator</text>

      <!-- Activation bars -->
      <rect x="275" y="128" width="10" height="260" rx="2" fill="rgba(45,49,66,0.12)"/>
      <rect x="517" y="188" width="10" height="200" rx="2" fill="rgba(235,108,54,0.15)"/>
      <rect x="775" y="206" width="10" height="48" rx="2" fill="rgba(79,93,117,0.12)"/>

      <!-- 3. Ctrl → Svc: softDelete(roomId) -->
      <line x1="285" y1="192" x2="514" y2="192" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="395" y="185" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">softDelete(roomId)</text>

      <!-- 4. Svc → DB: findRoomById -->
      <line x1="527" y1="210" x2="772" y2="210" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="648" y="204" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">findRoomById(roomId)</text>
      <!-- DB → Svc: Room -->
      <line x1="772" y1="230" x2="527" y2="230" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-ret)"/>
      <text x="648" y="224" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Room entity</text>

      <!-- 5. Svc → DB: countBlockingBookings -->
      <line x1="527" y1="260" x2="772" y2="260" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="648" y="254" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">countBlockingBookings(roomId, STATUS_LIST)</text>
      <!-- note -->
      <rect x="800" y="244" width="300" height="44" rx="3" fill="#fffbe8" stroke="#e8c84a" stroke-width="0.8"/>
      <text x="810" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">PENDING_DEPOSIT | CONFIRMED</text>
      <text x="810" y="275" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">CHECKED_IN | PENDING_INSPECTION</text>
      <text x="810" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">PENDING_DAMAGE_PAYMENT</text>
      <!-- DB → Svc: count -->
      <line x1="772" y1="298" x2="527" y2="298" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-ret)"/>
      <text x="648" y="292" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">count</text>

      <!-- ALT box -->
      <rect x="60" y="316" width="740" height="136" rx="4" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="6,3"/>
      <rect x="60" y="316" width="48" height="16" rx="2" fill="#4f5d75"/>
      <text x="84" y="327" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">alt</text>
      <line x1="60" y1="380" x2="800" y2="380" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>

      <!-- count > 0 branch -->
      <text x="76" y="345" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">[count &gt; 0]</text>
      <line x1="527" y1="358" x2="285" y2="358" stroke="#d32f2f" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-err)"/>
      <text x="395" y="352" fill="#d32f2f" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">throw ValidationException</text>
      <line x1="280" y1="368" x2="88" y2="368" stroke="#d32f2f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-err)"/>
      <text x="184" y="362" fill="#d32f2f" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">400 Bad Request</text>

      <!-- count == 0 branch -->
      <text x="76" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">[count == 0]</text>
      <line x1="527" y1="414" x2="772" y2="414" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="648" y="408" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">UPDATE rooms SET deleted_at = NOW()</text>
      <line x1="772" y1="430" x2="527" y2="430" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-ret)"/>
      <text x="648" y="424" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">success</text>
      <line x1="522" y1="444" x2="285" y2="444" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-ret)"/>
      <text x="395" y="438" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">SoftDeleteResponse</text>
      <line x1="280" y1="460" x2="88" y2="460" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-ret)"/>
      <text x="184" y="454" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">200 OK</text>

      <!-- ═══ FLOW 2: UPDATE FLOOR VALIDATION ═══ -->
      <rect x="20" y="488" width="1100" height="16" rx="3" fill="rgba(45,49,66,0.07)"/>
      <text x="36" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.14em">FLOW 2 — UPDATE FLOOR VALIDATION</text>

      <!-- Activations flow 2 -->
      <rect x="275" y="528" width="10" height="220" rx="2" fill="rgba(45,49,66,0.12)"/>
      <rect x="517" y="558" width="10" height="170" rx="2" fill="rgba(235,108,54,0.15)"/>

      <!-- 1. Manager → Ctrl: PUT /rooms/{roomId} -->
      <line x1="80" y1="532" x2="272" y2="532" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="170" y="526" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">PUT /rooms/{roomId} (body: floorId)</text>

      <!-- 2. Ctrl self: @PropertyAccessValidator -->
      <path d="M280,548 Q316,548 316,560 Q316,572 280,572" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="324" y="562" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">@PropertyAccessValidator</text>

      <!-- 3. Ctrl → Svc: updateRoom -->
      <line x1="285" y1="582" x2="514" y2="582" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="395" y="576" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">updateRoom(roomId, request)</text>

      <!-- 4. Svc → DB: load Room & new Floor -->
      <line x1="527" y1="600" x2="772" y2="600" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="648" y="594" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">findRoomById + findFloorById</text>
      <line x1="772" y1="618" x2="527" y2="618" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-ret)"/>
      <text x="648" y="612" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Room + Floor entities</text>

      <!-- ALT box flow 2 -->
      <rect x="60" y="636" width="740" height="112" rx="4" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="6,3"/>
      <rect x="60" y="636" width="48" height="16" rx="2" fill="#4f5d75"/>
      <text x="84" y="647" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">alt</text>
      <line x1="60" y1="692" x2="800" y2="692" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>

      <!-- wrong property branch -->
      <text x="76" y="657" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">[floor.property_id != room.property_id]</text>
      <line x1="527" y1="672" x2="285" y2="672" stroke="#d32f2f" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-err)"/>
      <text x="395" y="666" fill="#d32f2f" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">throw ValidationException</text>
      <line x1="280" y1="682" x2="88" y2="682" stroke="#d32f2f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-err)"/>
      <text x="184" y="676" fill="#d32f2f" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">400 — Cannot move to different property</text>

      <!-- same property branch -->
      <text x="76" y="708" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">[floor belongs to same property]</text>
      <line x1="527" y1="722" x2="772" y2="722" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
      <text x="648" y="716" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">UPDATE rooms SET floor_id = :newFloorId ...</text>
      <line x1="772" y1="736" x2="527" y2="736" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-ret)"/>
      <line x1="522" y1="748" x2="285" y2="748" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-ret)"/>
      <text x="395" y="742" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">RoomResponse</text>
      <line x1="280" y1="760" x2="88" y2="760" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-ret)"/>
      <text x="184" y="754" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">200 OK</text>

    </svg>
  </div>
</body>
</html>
