<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile · Class Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Class Diagram · Diagram Design</p>
    <h1>User Profile Architecture</h1>

    <svg viewBox="0 0 1000 860" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Relationships -->

        <!-- Controller to Service -->
        <line x1="500" y1="200" x2="500" y2="280" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
        <rect x="476" y="232" width="48" height="14" rx="2" fill="#f5f5f5"/>
        <text x="500" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">USES</text>

        <!-- Service to Repository -->
        <line x1="500" y1="420" x2="500" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="476" y="452" width="48" height="14" rx="2" fill="#f5f5f5"/>
        <text x="500" y="462" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CALLS</text>

        <!-- Repository to Entity -->
        <line x1="500" y1="600" x2="500" y2="680" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
        <rect x="476" y="632" width="48" height="14" rx="2" fill="#f5f5f5"/>
        <text x="500" y="642" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">RETURNS</text>

        
        <!-- ================= CLASSES ================= -->

        <!-- CONTROLLER: ProfileController -->
        <rect x="320" y="80" width="360" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="320" y="80" width="360" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="320" y="112" width="360" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="320" y1="120" x2="680" y2="120" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="336" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«REST CONTROLLER»</text>
        <text x="336" y="112" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">ProfileController</text>
        
        <text x="336" y="140" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getCurrentUser() : UserProfileResponse</text>
        <text x="336" y="160" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ updateCurrentUser(UpdateProfileRequest) : Response</text>


        <!-- SERVICE: UserService (Focal Coral) -->
        <rect x="340" y="280" width="320" height="140" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="340" y="280" width="320" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
        <rect x="340" y="312" width="320" height="8" fill="rgba(235,108,54,0.10)"/>
        <line x1="340" y1="320" x2="660" y2="320" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        <text x="356" y="296" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«SERVICE»</text>
        <text x="356" y="312" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">UserService</text>

        <!-- Fields -->
        <text x="356" y="340" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">- userRepository: UserRepository</text>

        <line x1="340" y1="356" x2="660" y2="356" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        
        <!-- Methods -->
        <text x="356" y="376" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getCurrentUserProfile(userId: UUID): User</text>
        <text x="356" y="396" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ updateProfile(userId, request): User</text>


        <!-- REPOSITORY: UserRepository -->
        <rect x="360" y="500" width="280" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="360" y="500" width="280" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="360" y="532" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="360" y1="540" x2="640" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="376" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«INTERFACE»</text>
        <text x="376" y="532" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">UserRepository</text>

        <text x="376" y="560" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ findById(id: UUID) : Optional&lt;User&gt;</text>
        <text x="376" y="580" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ save(user: User) : User</text>


        <!-- ENTITY: User -->
        <rect x="360" y="680" width="280" height="160" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1"/>
        <rect x="360" y="680" width="280" height="40" rx="6" fill="rgba(45,49,66,0.06)" stroke="none"/>
        <rect x="360" y="712" width="280" height="8" fill="rgba(45,49,66,0.06)"/>
        <line x1="360" y1="720" x2="640" y2="720" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="376" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«ENTITY»</text>
        <text x="376" y="712" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">User</text>

        <!-- Updatable fields are highlighted -->
        <text x="376" y="740" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">- id : UUID (read-only)</text>
        <text x="376" y="760" fill="#eb6c36" font-size="11" font-family="'Geist Mono', monospace" font-weight="600">- full_name : String (updatable)</text>
        <text x="376" y="780" fill="#eb6c36" font-size="11" font-family="'Geist Mono', monospace" font-weight="600">- phone : String (updatable)</text>
        <text x="376" y="800" fill="#eb6c36" font-size="11" font-family="'Geist Mono', monospace" font-weight="600">- avatar_url : String (updatable)</text>
        <text x="376" y="820" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">- email : String (read-only)</text>

      </svg>
  </div>
</body>
</html>
