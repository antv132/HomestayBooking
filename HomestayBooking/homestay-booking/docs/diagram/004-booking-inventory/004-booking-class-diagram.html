<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking & Inventory · Class Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1400px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1200px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Class Diagram · Diagram Design</p>
    <h1>Booking & Inventory Architecture</h1>

    <svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Relationships -->

        <!-- Controller to Service -->
        <line x1="300" y1="200" x2="300" y2="280" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
        <line x1="800" y1="200" x2="800" y2="280" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
        
        <!-- Services to BookingRepository -->
        <line x1="300" y1="420" x2="300" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="800" y1="420" x2="800" y2="460" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="800" y1="460" x2="300" y2="460" stroke="#4f5d75" stroke-width="1.2"/>

        <!-- BookingRepository to Booking -->
        <line x1="300" y1="580" x2="300" y2="640" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>

        <!-- Booking to related entities -->
        <line x1="420" y1="700" x2="520" y2="700" stroke="#4f5d75" stroke-width="1.2" />
        <rect x="428" y="692" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="434" y="702" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
        <rect x="498" y="692" width="16" height="12" rx="2" fill="#f5f5f5"/>
        <text x="506" y="702" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

        
        <!-- ================= CLASSES ================= -->

        <!-- CONTROLLER: BookingController -->
        <rect x="140" y="60" width="320" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="140" y="60" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="140" y="92" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="140" y1="100" x2="460" y2="100" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="156" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«REST CONTROLLER»</text>
        <text x="156" y="92" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">BookingController</text>
        
        <text x="156" y="120" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ createBooking(req) : Response</text>
        <text x="156" y="140" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getMyBookings() : List&lt;Detail&gt;</text>
        <text x="156" y="160" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ cancelBooking(id) : Response</text>


        <!-- CONTROLLER: ManagerBookingController -->
        <rect x="640" y="60" width="320" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="640" y="60" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="640" y="92" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="640" y1="100" x2="960" y2="100" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="656" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«REST CONTROLLER»</text>
        <text x="656" y="92" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">ManagerBookingController</text>
        
        <text x="656" y="120" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getPropertyBookings(propId)</text>
        <text x="656" y="140" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ checkIn(id) : Response</text>
        <text x="656" y="160" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ checkOut(id) : Response</text>
        <text x="656" y="180" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ modifyBooking(id, req) : Response</text>


        <!-- SERVICE: BookingService (Focal Coral) -->
        <rect x="140" y="280" width="320" height="140" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="140" y="280" width="320" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
        <rect x="140" y="312" width="320" height="8" fill="rgba(235,108,54,0.10)"/>
        <line x1="140" y1="320" x2="460" y2="320" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        <text x="156" y="296" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«SERVICE»</text>
        <text x="156" y="312" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">BookingService</text>

        <text x="156" y="340" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ createBooking(req) : Booking</text>
        <text x="156" y="360" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ cancelBooking(id) : void</text>
        <text x="156" y="380" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ processVNPayCallback(params)</text>

        <!-- SERVICE: ManagerBookingService (Focal Coral) -->
        <rect x="640" y="280" width="320" height="140" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="640" y="280" width="320" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
        <rect x="640" y="312" width="320" height="8" fill="rgba(235,108,54,0.10)"/>
        <line x1="640" y1="320" x2="960" y2="320" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        <text x="656" y="296" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«SERVICE»</text>
        <text x="656" y="312" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">ManagerBookingService</text>

        <text x="656" y="340" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ checkIn(id)</text>
        <text x="656" y="360" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ checkOut(id)</text>
        <text x="656" y="380" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ modifyBooking(id, req) : Booking</text>


        <!-- REPOSITORY: BookingRepository -->
        <rect x="140" y="500" width="320" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="140" y="500" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="140" y="532" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="140" y1="540" x2="460" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="156" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«INTERFACE»</text>
        <text x="156" y="532" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">BookingRepository</text>

        <text x="156" y="560" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ existsOverlapBooking(...) : boolean</text>


        <!-- ENTITY: Booking -->
        <rect x="180" y="640" width="240" height="180" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="180" y="640" width="240" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
        <rect x="180" y="672" width="240" height="8" fill="rgba(235,108,54,0.10)"/>
        <line x1="180" y1="680" x2="420" y2="680" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        <text x="196" y="656" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«ENTITY»</text>
        <text x="196" y="672" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Booking</text>

        <text x="196" y="700" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- id : UUID</text>
        <text x="196" y="720" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- status : BookingStatus</text>
        <text x="196" y="740" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- total_amount : decimal</text>
        <text x="196" y="760" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- deposit_amount : decimal</text>
        <text x="196" y="780" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- damage_fee_amount : decimal</text>
        <text x="196" y="800" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- check_in_date : Date</text>


        <!-- ENTITY: Payment -->
        <rect x="520" y="640" width="240" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="520" y="640" width="240" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="520" y="672" width="240" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="520" y1="680" x2="760" y2="680" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="536" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«ENTITY»</text>
        <text x="536" y="672" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Payment</text>

        <text x="536" y="700" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- id : UUID</text>
        <text x="536" y="720" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- type : ENUM</text>
        <text x="536" y="740" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- status : ENUM</text>

      </svg>
  </div>
</body>
</html>
