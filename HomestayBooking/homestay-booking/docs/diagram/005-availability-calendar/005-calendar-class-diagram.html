<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Availability Calendar · Class Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1400px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1200px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Class Diagram · Diagram Design</p>
    <h1>Availability Calendar Architecture</h1>

    <svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Relationships -->

        <!-- Controllers to Services -->
        <line x1="260" y1="200" x2="260" y2="280" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
        
        <line x1="720" y1="200" x2="720" y2="260" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
        <line x1="720" y1="260" x2="260" y2="260" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
        <line x1="720" y1="260" x2="1140" y2="260" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
        <line x1="1140" y1="260" x2="1140" y2="280" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>

        <!-- Service to Repositories -->
        <!-- CalendarStatusService -->
        <line x1="260" y1="420" x2="260" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="260" y1="460" x2="720" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="260" y1="480" x2="1140" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="720" y1="460" x2="720" y2="500" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="1140" y1="480" x2="1140" y2="500" stroke="#4f5d75" stroke-width="1.2"/>

        <!-- RoomStatusBlockService -->
        <line x1="1140" y1="420" x2="1140" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="1140" y1="440" x2="260" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>


        <!-- ================= CLASSES ================= -->

        <!-- CONTROLLER: CalendarController -->
        <rect x="100" y="60" width="320" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="100" y="60" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="100" y="92" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="100" y1="100" x2="420" y2="100" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="116" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«REST CONTROLLER»</text>
        <text x="116" y="92" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">CalendarController</text>
        
        <text x="116" y="120" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getRoomCalendar(roomId) : Response</text>

        <!-- CONTROLLER: ManagerCalendarController -->
        <rect x="560" y="60" width="320" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="560" y="60" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="560" y="92" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="560" y1="100" x2="880" y2="100" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="576" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«REST CONTROLLER»</text>
        <text x="576" y="92" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">ManagerCalendarController</text>
        
        <text x="576" y="120" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getManagerCalendar() : Response</text>
        <text x="576" y="140" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ addStatusBlock(req) : Block</text>


        <!-- SERVICE: CalendarStatusService (Focal Coral) -->
        <rect x="100" y="280" width="320" height="140" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="100" y="280" width="320" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
        <rect x="100" y="312" width="320" height="8" fill="rgba(235,108,54,0.10)"/>
        <line x1="100" y1="320" x2="420" y2="320" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        <text x="116" y="296" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«SERVICE»</text>
        <text x="116" y="312" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">CalendarStatusService</text>

        <text x="116" y="340" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ computeMonthlyCalendar() : List&lt;Day&gt;</text>
        <text x="116" y="360" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">- resolveDayStatus(sources) : Status</text>

        <!-- SERVICE: RoomStatusBlockService -->
        <rect x="980" y="280" width="320" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="980" y="280" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="980" y="312" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="980" y1="320" x2="1300" y2="320" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="996" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«SERVICE»</text>
        <text x="996" y="312" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">RoomStatusBlockService</text>

        <text x="996" y="340" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ addBlock(roomId, request) : Block</text>


        <!-- REPOSITORY: BookingRepository -->
        <rect x="100" y="500" width="320" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="100" y="500" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="100" y="532" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="100" y1="540" x2="420" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="116" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«INTERFACE»</text>
        <text x="116" y="532" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">BookingRepository</text>

        <!-- REPOSITORY: RoomStatusBlockRepository -->
        <rect x="560" y="500" width="320" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="560" y="500" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="560" y="532" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="560" y1="540" x2="880" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="576" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«INTERFACE»</text>
        <text x="576" y="532" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">RoomStatusBlockRepository</text>

        <!-- REPOSITORY: HKRepository -->
        <rect x="980" y="500" width="320" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="980" y="500" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="980" y="532" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="980" y1="540" x2="1300" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="996" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«INTERFACE»</text>
        <text x="996" y="532" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">HousekeepingTaskRepository</text>


        <!-- ENTITY: RoomStatusBlock -->
        <line x1="720" y1="580" x2="720" y2="640" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>

        <rect x="600" y="640" width="240" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="600" y="640" width="240" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="600" y="672" width="240" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="600" y1="680" x2="840" y2="680" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="616" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«ENTITY»</text>
        <text x="616" y="672" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">RoomStatusBlock</text>

        <text x="616" y="700" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- status : MAINTENANCE/OOS</text>
        <text x="616" y="720" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- start_date : Date</text>
        <text x="616" y="740" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- end_date : Date</text>
        <text x="616" y="760" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- active : boolean</text>

      </svg>
  </div>
</body>
</html>
