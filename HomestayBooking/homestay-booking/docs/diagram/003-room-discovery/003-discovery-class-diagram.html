<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Discovery · Class Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1400px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1200px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Class Diagram · Diagram Design</p>
    <h1>Room Discovery Architecture</h1>

    <svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Relationships -->

        <!-- Controller to Service -->
        <line x1="700" y1="240" x2="700" y2="300" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
        
        <!-- Service to RoomRepository -->
        <line x1="500" y1="420" x2="380" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Service to BookingRepository -->
        <line x1="900" y1="420" x2="1020" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Service to PropertyRepository -->
        <line x1="600" y1="480" x2="600" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- RoomRepository to Room -->
        <line x1="240" y1="480" x2="240" y2="700" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>

        <!-- PropertyRepository to Property -->
        <line x1="600" y1="640" x2="600" y2="700" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>

        <!-- BookingRepository to Booking -->
        <line x1="1160" y1="480" x2="1160" y2="700" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>

        <!-- Relationships Entities -->
        <line x1="480" y1="760" x2="380" y2="760" stroke="#4f5d75" stroke-width="1.2" />
        <rect x="388" y="752" width="16" height="12" rx="2" fill="#f5f5f5"/>
        <text x="396" y="762" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>
        <rect x="458" y="752" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="464" y="762" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

        
        <!-- ================= CLASSES ================= -->

        <!-- CONTROLLER: DiscoveryController -->
        <rect x="520" y="60" width="360" height="180" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="520" y="60" width="360" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="520" y="92" width="360" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="520" y1="100" x2="880" y2="100" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="536" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«REST CONTROLLER»</text>
        <text x="536" y="92" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">DiscoveryController</text>
        
        <text x="536" y="120" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ searchRooms(criteria) : Page&lt;RoomListItem&gt;</text>
        <text x="536" y="140" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getRoomDetail(id) : RoomDetail</text>
        <text x="536" y="160" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getRoomAvailability(id, y, m) : RoomAvailability</text>
        <text x="536" y="180" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getSearchSuggestions(query) : List&lt;Suggestion&gt;</text>
        <text x="536" y="200" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getFeaturedProperties() : List&lt;PropertyDto&gt;</text>
        <text x="536" y="220" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getActivePromotions() : List&lt;PromotionDto&gt;</text>


        <!-- SERVICE: DiscoveryService (Focal Coral) -->
        <rect x="500" y="300" width="400" height="180" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="500" y="300" width="400" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
        <rect x="500" y="332" width="400" height="8" fill="rgba(235,108,54,0.10)"/>
        <line x1="500" y1="340" x2="900" y2="340" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        <text x="516" y="316" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«SERVICE»</text>
        <text x="516" y="332" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">DiscoveryService</text>

        <!-- Fields -->
        <text x="516" y="360" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">- roomRepository: RoomRepository</text>
        <text x="516" y="380" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">- propertyRepository: PropertyRepository</text>
        <text x="516" y="400" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">- bookingRepository: BookingRepository</text>

        <line x1="500" y1="416" x2="900" y2="416" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        
        <!-- Methods -->
        <text x="516" y="436" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ searchRooms(criteria): Page&lt;RoomListItem&gt;</text>
        <text x="516" y="456" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getRoomDetail(id): RoomDetail</text>
        <text x="516" y="476" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ checkAvailability(id, dates): RoomAvailability</text>


        <!-- REPOSITORY: RoomRepository -->
        <rect x="80" y="380" width="300" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="80" y="380" width="300" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="80" y="412" width="300" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="80" y1="420" x2="380" y2="420" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="96" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«INTERFACE»</text>
        <text x="96" y="412" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">RoomRepository</text>

        <text x="96" y="440" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ findAvailableRooms(filters) : Page&lt;Room&gt;</text>
        <text x="96" y="460" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ findByIdAndStatus(id) : Optional&lt;Room&gt;</text>


        <!-- REPOSITORY: BookingRepository -->
        <rect x="1020" y="380" width="300" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="1020" y="380" width="300" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="1020" y="412" width="300" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="1020" y1="420" x2="1320" y2="420" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="1036" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«INTERFACE»</text>
        <text x="1036" y="412" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">BookingRepository</text>

        <text x="1036" y="440" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ findOverlappingBookings(...) : List&lt;Booking&gt;</text>


        <!-- REPOSITORY: PropertyRepository -->
        <rect x="460" y="560" width="280" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="460" y="560" width="280" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="460" y="592" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="460" y1="600" x2="740" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="476" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«INTERFACE»</text>
        <text x="476" y="592" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">PropertyRepository</text>
        <text x="476" y="620" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ searchSuggestions(k) : List&lt;Suggestion&gt;</text>


        <!-- ENTITY: Room -->
        <rect x="140" y="700" width="240" height="140" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="140" y="700" width="240" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
        <rect x="140" y="732" width="240" height="8" fill="rgba(235,108,54,0.10)"/>
        <line x1="140" y1="740" x2="380" y2="740" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        <text x="156" y="716" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«ENTITY»</text>
        <text x="156" y="732" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Room</text>

        <text x="156" y="760" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- id : UUID</text>
        <text x="156" y="780" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- roomType : String</text>
        <text x="156" y="800" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- capacity : int</text>
        <text x="156" y="820" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- pricePerNight : decimal</text>


        <!-- ENTITY: Property -->
        <rect x="480" y="700" width="240" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="480" y="700" width="240" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="480" y="732" width="240" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="480" y1="740" x2="720" y2="740" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="496" y="716" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«ENTITY»</text>
        <text x="496" y="732" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Property</text>

        <text x="496" y="760" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- id : UUID</text>
        <text x="496" y="780" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- name : String</text>
        <text x="496" y="800" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- status : StatusEnum</text>

        <!-- ENTITY: Booking -->
        <rect x="1040" y="700" width="240" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="1040" y="700" width="240" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="1040" y="732" width="240" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="1040" y1="740" x2="1280" y2="740" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="1056" y="716" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«ENTITY»</text>
        <text x="1056" y="732" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Booking (Read-Only)</text>

        <text x="1056" y="760" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- id : UUID</text>
        <text x="1056" y="780" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- checkInDate : Date</text>
        <text x="1056" y="800" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- checkOutDate : Date</text>
        <text x="1056" y="820" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- status : StatusEnum</text>

      </svg>
  </div>
</body>
</html>
