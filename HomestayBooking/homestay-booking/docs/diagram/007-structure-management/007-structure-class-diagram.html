<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Structure Management · Class Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1400px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1200px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Class Diagram · Diagram Design</p>
    <h1>Structure Management Architecture</h1>

    <svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Relationships -->

        <!-- Controllers to Services -->
        <line x1="260" y1="200" x2="260" y2="280" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
        <line x1="720" y1="200" x2="720" y2="280" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
        
        <!-- Services to Repositories -->
        <line x1="260" y1="420" x2="260" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="720" y1="420" x2="720" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Cross Service-Repo -->
        <line x1="260" y1="460" x2="720" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="720" y1="460" x2="260" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>


        <!-- Repositories to Entities -->
        <line x1="260" y1="580" x2="260" y2="640" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
        <line x1="720" y1="580" x2="720" y2="640" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>


        <!-- Entity Relationships -->
        <!-- Property to Floor -->
        <line x1="-50" y1="700" x2="160" y2="700" stroke="#4f5d75" stroke-width="1.2" />
        <rect x="140" y="692" width="16" height="12" rx="2" fill="#f5f5f5"/>
        <text x="148" y="702" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">*</text>

        <!-- Floor to Room -->
        <line x1="480" y1="700" x2="600" y2="700" stroke="#4f5d75" stroke-width="1.2" />
        <rect x="488" y="692" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="494" y="702" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
        <rect x="580" y="692" width="16" height="12" rx="2" fill="#f5f5f5"/>
        <text x="588" y="702" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">*</text>

        <!-- ================= CLASSES ================= -->

        <!-- CONTROLLER: StructureTreeController -->
        <rect x="100" y="60" width="320" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="100" y="60" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="100" y="92" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="100" y1="100" x2="420" y2="100" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="116" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«REST CONTROLLER»</text>
        <text x="116" y="92" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">StructureTreeController</text>
        
        <text x="116" y="120" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getPropertyStructure(propertyId)</text>

        <!-- CONTROLLER: FloorController -->
        <rect x="560" y="60" width="320" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="560" y="60" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="560" y="92" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="560" y1="100" x2="880" y2="100" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="576" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«REST CONTROLLER»</text>
        <text x="576" y="92" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">FloorController</text>
        
        <text x="576" y="120" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ createFloor(propertyId, req)</text>
        <text x="576" y="140" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ updateFloor(floorId, req)</text>
        <text x="576" y="160" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ deleteFloor(floorId)</text>


        <!-- SERVICE: StructureTreeService -->
        <rect x="100" y="280" width="320" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="100" y="280" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="100" y="312" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="100" y1="320" x2="420" y2="320" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="116" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«SERVICE»</text>
        <text x="116" y="312" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">StructureTreeService</text>

        <text x="116" y="340" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ getTree(propertyId)</text>

        <!-- SERVICE: FloorService (Focal Coral) -->
        <rect x="560" y="280" width="320" height="140" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="560" y="280" width="320" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
        <rect x="560" y="312" width="320" height="8" fill="rgba(235,108,54,0.10)"/>
        <line x1="560" y1="320" x2="880" y2="320" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        <text x="576" y="296" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«SERVICE»</text>
        <text x="576" y="312" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">FloorService</text>

        <text x="576" y="340" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ createFloor(propertyId, req)</text>
        <text x="576" y="360" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ updateFloor(floorId, req)</text>
        <text x="576" y="380" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">+ deleteFloor(floorId)</text>


        <!-- REPOSITORY: FloorRepository -->
        <rect x="100" y="500" width="320" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="100" y="500" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="100" y="532" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="100" y1="540" x2="420" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="116" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«INTERFACE»</text>
        <text x="116" y="532" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">FloorRepository</text>

        <!-- REPOSITORY: RoomRepository (External read-only logic) -->
        <rect x="560" y="500" width="320" height="80" rx="6" fill="rgba(45,49,66,0.02)" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="560" y="500" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="560" y="532" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="560" y1="540" x2="880" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="576" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«INTERFACE / FR-08»</text>
        <text x="576" y="532" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">RoomRepository</text>

        <!-- ENTITY: Property (External) -->
        <rect x="-150" y="640" width="100" height="100" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="-140" y="660" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Property</text>
        
        <!-- ENTITY: Floor -->
        <rect x="160" y="640" width="320" height="140" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="160" y="640" width="320" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
        <rect x="160" y="672" width="320" height="8" fill="rgba(235,108,54,0.10)"/>
        <line x1="160" y1="680" x2="480" y2="680" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        <text x="176" y="656" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«ENTITY»</text>
        <text x="176" y="672" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Floor</text>

        <text x="176" y="700" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- property_id : UUID</text>
        <text x="176" y="720" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- floor_number : int</text>
        <text x="176" y="740" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- description : String</text>

        <!-- ENTITY: Room -->
        <rect x="600" y="640" width="320" height="140" rx="6" fill="rgba(45,49,66,0.02)" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="600" y="640" width="320" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="600" y="672" width="320" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="600" y1="680" x2="920" y2="680" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="616" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">«ENTITY / FR-08 READONLY»</text>
        <text x="616" y="672" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Room</text>

        <text x="616" y="700" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- floor_id : UUID</text>
        <text x="616" y="720" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- room_number : String</text>
        <text x="616" y="740" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">- status : String</text>
        
      </svg>
  </div>
</body>
</html>
