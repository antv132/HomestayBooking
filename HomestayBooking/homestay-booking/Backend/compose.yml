services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: homestay-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD before starting Docker Compose}"
    ports:
      - "1433:1433"
    volumes:
      - homestay_sql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD before starting Docker Compose}"
    entrypoint: /bin/bash
    command:
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd
        -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF DB_ID(N'HomestayManagement') IS NULL CREATE DATABASE HomestayManagement;"
    restart: "no"

volumes:
  homestay_sql_data:
    name: homestay_sql_data
