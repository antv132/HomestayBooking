name: Tests

on:
  push:
    branches: [main, DEV, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests + JaCoCo + soft floor (≥15%) + critical ≥80%
        run: chmod +x ./mvnw && ./mvnw -B -Pcoverage-critical verify
      - name: Upload JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
