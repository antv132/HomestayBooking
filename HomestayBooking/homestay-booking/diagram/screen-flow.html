<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High-Level Screens Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5f5f5;
      --paper-2: #ffffff;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --rule: rgba(45,49,66,0.12);
    }
    body {
      margin: 0;
      padding: 40px;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Geist', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header {
      max-width: 900px;
      margin: 0 auto 32px;
    }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2.5rem;
      font-weight: 400;
      margin: 0 0 16px;
      line-height: 1.1;
    }
    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      max-width: 600px;
      margin: 0;
    }
    .diagram-container {
      max-width: 900px;
      margin: 0 auto;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Architecture Diagram</div>
    <h1>Homestay Screens Flow</h1>
    <p class="subtitle">High-level navigation map covering 69 screens across 5 distinct portals. Core operational hubs are highlighted in rust.</p>

          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->

      <rect x="48" y="44" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="86" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FRONT-END</text>

      <rect x="280" y="40" width="420" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <text x="336" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SECURE PORTALS</text>

      <!-- Arrows -->
      <path d="M 140,144 V 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 140,264 V 312" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <path d="M 380,320 V 240 Q 380,232 388,232 H 512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="608" y="160" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="626" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SETUP</text>
      
      <rect x="628" y="280" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="289" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASSIGN</text>
      
      <rect x="532" y="288" width="40" height="12" rx="2" fill="#f5f5f5"/>

      <rect x="300" y="320" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="320" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="356" y="326" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="380" y="335" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">14 SCREENS</text>
      <text x="380" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Customer Dashboard</text>
      <text x="380" y="370" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">My Bookings &amp; Tickets</text>

      <rect x="520" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="200" width="160" height="64" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="576" y="206" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="600" y="215" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">20 SCREENS</text>
      <text x="600" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Manager Workspace</text>
      <text x="600" y="250" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Property Operations</text>

      <rect x="520" y="320" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="320" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="576" y="326" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>

      <text x="600" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Employee App</text>
      <text x="600" y="370" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Housekeeping / Maint</text>

      <rect x="520" y="80" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="80" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="576" y="86" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="600" y="95" fill="rgba(45,49,66,0.8)" font, sans-serif" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">14 SCREENS</text>
      <text x="600" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Admin Console</text>
      <text x="600" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Global Setup &amp; KPIs</text>

      <!-- Legend -->
      <line x1="40" y1="460" x2="700" y2="460" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="470" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

      <rect x="232" y="470" width="12" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1"/>
      <text x="252" y="478" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Core Business Hub</text>

      <line x1="360" y1="476" x2="384" y2="476" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="392" y="478" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">User / Data Flow</text>

      <rect x="496" y="470" width="12" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="516" y="478" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Access Boundary</text>

  </div>
</body>
</html>
